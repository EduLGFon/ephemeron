services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ephemeron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ephemeron
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemeron -d ephemeron"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8091}
      DATABASE_URL: postgresql://ephemeron:${POSTGRES_PASSWORD:?}@db:5432/ephemeron
      JWT_SECRET: ${JWT_SECRET:?}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ephemeron.spotnik.space}
      ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC:-900}
      REFRESH_TOKEN_TTL_SEC: ${REFRESH_TOKEN_TTL_SEC:-2592000}
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8091"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "deno eval --allow-net=127.0.0.1 --allow-read=/app,/deno-dir \"const r=await fetch('http://127.0.0.1:8091/health'); if(!r.ok) throw new Error('unhealthy');\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
